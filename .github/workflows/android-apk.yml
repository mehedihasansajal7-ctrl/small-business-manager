name: Android APK

# Builds a signed, side-loadable release APK on a GitHub runner (which has the JDK
# and the Android SDK pre-installed) and publishes it to the PUBLIC downloads repo,
# exactly like the Family Finance app does:
#
#   https://github.com/mehedihasansajal7-ctrl/small-business-manager-downloads/releases
#
# Why CI instead of building locally: a first Android build needs ~5-7 GB of
# downloaded toolchain (JDK, SDK, Gradle cache, NDK for Reanimated). The authoring
# machine had ~1 GB free, so building here is the only zero-cost option.
#
# Cost: runs on GitHub's free Actions minutes. Nothing else is required - no Expo
# account, no EAS subscription, no Play Console.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish, e.g. v0.1.0'
        required: true
        default: 'v0.1.0'
      apiUrl:
        description: 'API base URL baked into this build (users can change it in the app)'
        required: true
        default: 'http://192.168.0.20:8787'
      releaseNotes:
        description: 'Short release notes (optional)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  apk:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # Metro inlines this into the JS bundle at build time; the app can override
      # it at runtime on the sign-in screen ("Advanced: which server?").
      EXPO_PUBLIC_API_URL: ${{ inputs.apiUrl }}
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
      # ubuntu-latest ships the Android SDK; `android-actions/setup-android` is
      # NOT used because its own sdkmanager call fails against cmdline-tools 16.x
      # (the licence prompt exits 1). We drive sdkmanager ourselves instead.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licences and install platform/build tools
        run: |
          set -euo pipefail
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)
          test -x "$SDKMGR" || { echo "::error::sdkmanager not found under $ANDROID_HOME"; exit 1; }
          echo "Using $SDKMGR"
          # Accept every licence so Gradle can also auto-install the NDK later.
          yes | "$SDKMGR" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$(ls "$ANDROID_HOME")"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Build the shared domain package
        run: |
          npm ci
          npm run build:domain

      - name: Install the mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Allow a LAN HTTP server in this sideloaded build
        working-directory: apps/mobile
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # A self-hosted API on an office LAN is reached over plain HTTP, which
          # Android blocks by default for release builds. This APK is distributed
          # by sideloading, so cleartext is enabled deliberately here and the
          # README says to remove it once the API is served over HTTPS.
          python3 - "$MANIFEST" <<'PY'
          import re, sys
          path = sys.argv[1]
          xml = open(path, encoding='utf-8').read()
          if 'usesCleartextTraffic' in xml:
              print('already present')
          else:
              xml = re.sub(r'<application\b', '<application android:usesCleartextTraffic="true"', xml, count=1)
              open(path, 'w', encoding='utf-8').write(xml)
              print('added android:usesCleartextTraffic="true"')
          PY
          grep -q 'usesCleartextTraffic' "$MANIFEST" && echo "manifest verified"

      - name: Report the resolved app configuration
        working-directory: apps/mobile
        run: npx expo config --type public | head -40

      - name: Assemble the release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect the APK
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$SRC" ]; then echo "No APK produced" >&2; exit 1; fi
          NAME="SmallBusinessManager-${{ inputs.version }}.apk"
          mkdir -p dist
          cp "$SRC" "dist/$NAME"
          ls -lh "dist/$NAME"
          # Prove it is a real APK and show the signer, so the release is verifiable.
          file "dist/$NAME"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)
          "$APKSIGNER" verify --print-certs "dist/$NAME" | head -20 || true
          echo "path=dist/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish the release to the public downloads repository
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::The DOWNLOADS_TOKEN secret is missing, so the APK cannot be published."
            exit 1
          fi
          REPO=mehedihasansajal7-ctrl/small-business-manager-downloads
          TAG="${{ inputs.version }}"
          NAME="${{ steps.apk.outputs.name }}"

          NOTES=$(cat <<EOF
          # Small Business Manager — Android (${TAG})

          **English** · [বাংলা](#বাংলা--বাংলা-ভাষায়-নিচে)

          Side-loadable Android APK for **Small Business Manager**: small business management **plus** the full farming module, for 2–5 business partners in Bangladesh. Offline-first, and no paid service is required anywhere.

          ## English

          ### ⬇️ Download
          `\`$NAME\`` from the assets below.

          ### Install
          1. Download the APK, tap it, and allow installing from this source once.
          2. If Play Protect warns *"unknown developer"*, choose **Install anyway**.

          ### ⚠️ First run: set the server address
          The app is a client and needs a Small Business Manager API. On the sign-in screen expand **Advanced: which server?**, type the address (for example `\`${{ inputs.apiUrl }}\``), tap **Test and save this server**, then sign in. This build was baked with that address as a default only — the address you save inside the app wins.

          ### Language
          Fully bilingual, **English by default** (since v0.1.3). The switcher is on the **sign-in screen itself** (so it is reachable before login) and in **Settings → Language**.

          ${{ inputs.releaseNotes }}

          ### Honest limitations
          - Side-loaded build, not on Google Play; update by installing a newer APK over the old one.
          - Needs a reachable API server (see `DEPLOYMENT_FREE.md` in the private source repository).
          - First sign-in and accepting an invite need the server; after that the app works offline.
          - Not tax or audit software; no regulatory compliance is claimed.

          ---

          ## বাংলা — বাংলা ভাষায় নিচে

          **ছোট ব্যবসা ম্যানেজার** অ্যাপের অ্যান্ড্রয়েড APK: ছোট ব্যবসার সম্পূর্ণ হিসাব **এবং** পূর্ণ কৃষি/খামার মডিউল — বাংলাদেশের ২–৫ জন অংশীদারের জন্য। অফলাইনেও চলে, আর কোথাও কোনো টাকা লাগে না।

          ### ⬇️ ডাউনলোড
          নিচের asset থেকে `\`$NAME\`` ফাইলটি নিন।

          ### ইনস্টল
          1. APK ফাইলটি ডাউনলোড করুন, তাতে ট্যাপ করুন, এবং একবার "এই সোর্স থেকে ইনস্টল করার অনুমতি" দিন।
          2. Play Protect যদি *"unknown developer"* সতর্কতা দেয়, **Install anyway** চাপুন।

          ### ⚠️ প্রথমবার: সার্ভারের ঠিকানা দিতে হবে
          অ্যাপটি একটি ক্লায়েন্ট, এটির জন্য Small Business Manager API দরকার। সাইন-ইন স্ক্রিনে **Advanced: which server?** খুলে ঠিকানা লিখুন (যেমন `\`${{ inputs.apiUrl }}\``), **Test and save this server** চাপুন, তারপর সাইন-ইন করুন। ডিফল্ট ঠিকানাটি কেবল নমুনা — অ্যাপের ভেতরে সংরক্ষিত ঠিকানাই আসলে ব্যবহার হয়।

          ### ভাষা
          সম্পূর্ণ দ্বিভাষিক, **ডিফল্ট এখন ইংরেজি** (v0.1.3 থেকে)। বাংলায় বদলাতে চাইলে বোতামটি **সাইন-ইন স্ক্রিনেই** আছে (লগইনের আগেই পাওয়া যায়) এবং **Settings → Language**-এও আছে।

          ### সৎ সীমাবদ্ধতা
          - এটি side-load বিল্ড, Google Play-তে নেই; নতুন APK পুরোনোটির উপরে ইনস্টল করে আপডেট করুন।
          - কাজ করার জন্য একটি চালু API সার্ভার দরকার (প্রাইভেট সোর্স রিপোর `DEPLOYMENT_FREE.md` দেখুন)।
          - প্রথম সাইন-ইন ও ইনভাইট গ্রহণে ইন্টারনেট লাগে; এরপর অ্যাপ অফলাইনেও চলে।
          - এটি কর বা অডিট সফটওয়্যার নয়; কোনো নিয়মনীতি মেনে চলার দাবিও নেই।
          EOF
          )

          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "Release $TAG already exists; replacing the asset."
            gh release upload "$TAG" "dist/$NAME" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "dist/$NAME" --repo "$REPO" --title "Small Business Manager $TAG" --notes "$NOTES"
          fi

          echo "Published to https://github.com/$REPO/releases/tag/$TAG"
          echo "Direct link: https://github.com/$REPO/releases/download/$TAG/$NAME"
