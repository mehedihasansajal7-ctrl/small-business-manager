<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="Small Business Manager — offline-first business and farming workspace for 2-5 partners." />
    <title>Small Business Manager</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      (function () {
        try {
          var stored = localStorage.getItem('sbm.theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          /* first paint without a theme is acceptable */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This application needs JavaScript. / এই অ্যাপ্লিকেশনটি চালাতে জাভাস্ক্রিপ্ট প্রয়োজন।</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
